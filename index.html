<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snorky Tracker</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Snorky">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏕️</text></svg>">

    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --secondary: #c62828;
            --secondary-dark: #9e1d1d;
            --bg: #f4f6f1;
            --card: #ffffff;
            --text: #2b2b2b;
            --muted: #6e6e6e;
            --line: #e7e7e7;
            --shadow: 0 8px 18px rgba(0,0,0,0.06);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            background: linear-gradient(180deg, #edf5ed 0%, var(--bg) 100%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .logo-svg {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
        }

        .title-group h1 {
            margin: 0;
            color: var(--primary-dark);
            font-size: 1.6rem;
            line-height: 1.1;
        }

        .title-group p {
            margin: 2px 0 0;
            color: var(--muted);
            font-size: 0.8rem;
        }

        .btn-settings {
            background: none;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 1.2rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .card {
            background: var(--card);
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: 14px;
            margin-bottom: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-card {
            background: #f9faf8;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .stat-card .label {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 3px;
        }

        .stat-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            margin: 3px 0;
        }

        .stat-number.red {
            color: var(--secondary);
        }

        .stat-meta {
            font-size: 0.75rem;
            color: var(--muted);
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--muted);
        }

        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #dfe3d8;
            font-size: 1rem;
            background: #fff;
            color: var(--text);
        }

        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.12s ease, opacity 0.12s ease;
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: #6b7d68;
            color: white;
            font-size: 0.85rem;
            padding: 8px;
        }

        .btn-danger {
            background: var(--secondary);
            color: white;
            font-size: 0.85rem;
            padding: 8px;
        }

        .btn-ghost {
            background: #edf1ec;
            color: var(--text);
            font-size: 0.85rem;
            padding: 8px;
        }

        .day-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-top: 10px;
        }

        .day-pill {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #f5f7f4;
            padding: 6px 3px;
            text-align: center;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            color: var(--text);
            transition: background 0.15s ease, border-color 0.15s ease;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .day-pill:active {
            transform: scale(0.95);
        }

        .day-pill.ude {
            background: #e6f5e7;
            border-color: #bfe5c2;
            color: var(--primary-dark);
        }

        .day-pill.inde {
            background: #fde9e8;
            border-color: #f5c1be;
            color: var(--secondary-dark);
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--line);
            font-size: 0.9rem;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            display: inline-block;
            min-width: 40px;
            text-align: center;
            border-radius: 999px;
            padding: 3px 7px;
            font-size: 0.65rem;
            font-weight: 800;
            color: white;
        }

        .badge-ude {
            background: var(--primary);
        }

        .badge-inde {
            background: var(--secondary);
        }

        .btn-delete {
            width: auto;
            background: transparent;
            color: #8a8a8a;
            font-size: 1rem;
            padding: 4px 6px;
        }

        .btn-delete:hover {
            color: var(--secondary);
        }

        .muted {
            color: var(--muted);
            font-size: 0.8rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--card);
            border-radius: 16px;
            padding: 18px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 {
            margin: 0 0 12px;
            color: var(--primary-dark);
        }

        .close-btn {
            float: right;
            font-size: 1.5rem;
            cursor: pointer;
            background: none;
            border: none;
            color: var(--muted);
            padding: 0;
            width: auto;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .controls-row {
            display: grid;
            gap: 6px;
            margin-top: 8px;
        }

        @media (max-width: 440px) {
            .title-group h1 {
                font-size: 1.3rem;
            }

            .stat-number {
                font-size: 1.8rem;
            }

            .day-grid {
                grid-template-columns: repeat(7, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo-title">

            <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="46" fill="none" stroke="#2e7d32" stroke-width="4"/>
                <circle cx="50" cy="50" r="41" fill="#e8f5e9"/>
                <polygon points="25,65 40,40 55,65" fill="#a5d6a7"/>
                <polygon points="45,65 60,35 75,65" fill="#81c784"/>
                <polygon points="30,70 50,42 70,70" fill="#2e7d32"/>
                <polygon points="50,42 50,70 65,70" fill="#1b5e20"/>
                <polygon points="42,70 50,54 58,70" fill="#fff9c4"/>
                <circle cx="50" cy="74" r="3" fill="#ffb74d"/>
                <polygon points="48,74 50,68 52,74" fill="#e65100"/>
                <polygon points="46,75 54,75 50,72" fill="#795548"/>
                <path d="M35,28 L36,31 L39,31 L37,33 L38,36 L35,34 L32,36 L33,33 L31,31 L34,31 Z" fill="#fbc02d"/>
                <path d="M65,24 L65.5,26 L67,26 L65.8,27 L66.3,28.5 L65,27.5 L63.7,28.5 L64.2,27 L63,26 L64.5,26 Z" fill="#fbc02d"/>
            </svg>

            <div class="title-group">
                <h1>Snorky</h1>
                <p id="subtitle-text">365 nætter i telt</p>
            </div>

        </div>

        <button class="btn-settings" onclick="toggleModal()">⚙️</button>
    </div>

    <div class="stats-grid">

        <div class="stat-card">
            <div class="label">Nætter i telt</div>
            <div class="stat-number" id="count-ude">0</div>
            <div class="stat-meta" id="left-ude">365 tilbage</div>
        </div>

        <div class="stat-card">
            <div class="label">Brugte fridage</div>
            <div class="stat-number red" id="count-inde">0</div>
            <div class="stat-meta" id="left-inde">35 tilbage</div>
        </div>

    </div>

    <div class="card">

        <div class="form-group">
            <label for="date-input">Registrer nat</label>
            <input type="date" id="date-input">
        </div>

        <div class="form-group">
            <label for="type-input">Type</label>

            <select id="type-input">
                <option value="ude">Sover ude (Telt/Terrasse)</option>
                <option value="inde">Sover inde (Fridag)</option>
            </select>
        </div>

        <button class="btn-primary" onclick="tilfoejDag()">Registrer</button>

    </div>

    <div class="card">

        <h3 style="margin:0 0 6px; color: var(--primary-dark); font-size: 0.9rem;">
            Periode oversigt
        </h3>

        <div id="day-grid" class="day-grid"></div>

    </div>

    <div class="card">

        <h3 style="margin:0 0 6px; color: var(--primary-dark); font-size: 0.9rem;">
            Logbog
        </h3>

        <ul class="history-list" id="history-list"></ul>

    </div>

</div>


<div id="settings-modal" class="modal">

    <div class="modal-content">

        <button class="close-btn" onclick="toggleModal()">✕</button>

        <h2>Indstillinger</h2>

        <div class="settings-grid">

            <div class="form-group">
                <label for="config-from">Start dato</label>
                <input type="date" id="config-from">
            </div>

            <div class="form-group">
                <label for="config-to">Slut dato</label>
                <input type="date" id="config-to">
            </div>

            <div class="form-group">
                <label for="config-target-ude">Mål ude dage</label>
                <input type="number" id="config-target-ude" min="0" value="365">
            </div>

            <div class="form-group">
                <label for="config-target-inde">Mål fridage</label>
                <input type="number" id="config-target-inde" min="0" value="35">
            </div>

        </div>

        <div class="controls-row">

            <button class="btn-primary"
                    onclick="gemIndstillinger(); toggleModal();">
                Gem
            </button>

            <button class="btn-ghost" onclick="sætAlleTilUde()">
                Sæt alle dage til ude
            </button>

            <button class="btn-ghost" onclick="resetTilStandard()">
                Reset
            </button>

            <button class="btn-secondary" onclick="eksporterData()">
                📥 Eksporter
            </button>

            <button class="btn-secondary" onclick="importerData()">
                📤 Importér
            </button>

            <input
                type="file"
                id="import-file"
                accept=".json"
                style="display:none;"
            >

            <button class="btn-danger" onclick="nulstilAlt()">
                🗑️ Slet alt
            </button>

        </div>

    </div>

</div>


<script>

    const DATA_KEY = 'snorkyData_v2';
    const CONFIG_KEY = 'snorkyConfig_v2';

    const DEFAULT_CONFIG = {
        startDato: '2026-08-23',
        slutDato: '2026-10-01',
        targetUde: 365,
        targetInde: 35
    };

    let config = loadConfig();
    let data = loadData();


    function toggleModal() {

        const modal = document.getElementById('settings-modal');

        modal.classList.toggle('show');

    }


    function loadConfig() {

        try {

            const saved = JSON.parse(
                localStorage.getItem(CONFIG_KEY)
            );

            if (saved && typeof saved === 'object') {

                return {
                    ...DEFAULT_CONFIG,
                    ...saved
                };

            }

        } catch (_) {}

        return {
            ...DEFAULT_CONFIG
        };

    }


    function saveConfig() {

        localStorage.setItem(
            CONFIG_KEY,
            JSON.stringify(config)
        );

    }


    function loadData() {

        try {

            const saved = JSON.parse(
                localStorage.getItem(DATA_KEY)
            );

            if (Array.isArray(saved)) {

                return saved.filter(
                    item =>
                        item &&
                        item.dato &&
                        (
                            item.type === 'ude' ||
                            item.type === 'inde'
                        )
                );

            }

        } catch (_) {}

        return [];

    }


    function saveData() {

        localStorage.setItem(
            DATA_KEY,
            JSON.stringify(data)
        );

    }


    function formatDateDK(raw) {

        if (!raw) return '';

        const [year, month, day] =
            raw.split('-').map(Number);

        return `${String(day).padStart(2, '0')}-${String(month).padStart(2, '0')}-${year}`;

    }


    function dateKey(date) {

        return date.toISOString().slice(0, 10);

    }


    function getRangeDates(start, end) {

        const result = [];

        const startDate =
            new Date(start + 'T00:00:00Z');

        const endDate =
            new Date(end + 'T00:00:00Z');

        for (
            let d = new Date(startDate);
            d <= endDate;
            d.setUTCDate(d.getUTCDate() + 1)
        ) {

            result.push(dateKey(d));

        }

        return result;

    }


    function ensureDatesInPeriod() {

        const range =
            getRangeDates(
                config.startDato,
                config.slutDato
            );

        for (const iso of range) {

            if (!data.some(item => item.dato === iso)) {

                data.push({
                    dato: iso,
                    type: 'ude'
                });

            }

        }

        saveData();

    }


    function updateConfigInputs() {

        document.getElementById('config-from').value =
            config.startDato;

        document.getElementById('config-to').value =
            config.slutDato;

        document.getElementById('config-target-ude').value =
            config.targetUde;

        document.getElementById('config-target-inde').value =
            config.targetInde;

    }


    function renderStats() {

        const udeDage =
            data.filter(item => item.type === 'ude').length;

        const indeDage =
            data.filter(item => item.type === 'inde').length;

        document.getElementById('count-ude').textContent =
            udeDage;

        document.getElementById('count-inde').textContent =
            indeDage;

        document.getElementById('left-ude').textContent =
            Math.max(
                0,
                config.targetUde - udeDage
            ) + ' tilbage';

        document.getElementById('left-inde').textContent =
            Math.max(
                0,
                config.targetInde - indeDage
            ) + ' tilbage';

        document.getElementById('subtitle-text').textContent =
            `${config.targetUde} nætter i telt`;

    }


    function renderDayGrid() {

        const grid =
            document.getElementById('day-grid');

        grid.innerHTML = '';

        const range =
            getRangeDates(
                config.startDato,
                config.slutDato
            );

        range.forEach((iso) => {

            const item =
                data.find(d => d.dato === iso);

            const type =
                item ? item.type : 'ude';

            const btn =
                document.createElement('button');

            btn.type = 'button';

            btn.className =
                `day-pill ${type}`;

            btn.textContent =
                new Date(
                    iso + 'T00:00:00Z'
                ).getUTCDate();

            btn.title =
                formatDateDK(iso);

            btn.addEventListener(
                'click',
                () => toggleDateType(iso)
            );

            grid.appendChild(btn);

        });

    }


    function renderHistory() {

        const list =
            document.getElementById('history-list');

        const sorted =
            [...data].sort(
                (a, b) =>
                    new Date(b.dato) -
                    new Date(a.dato)
            );

        if (!sorted.length) {

            list.innerHTML =
                '<li class="muted" style="padding: 12px 0; text-align: center;">Ingen registreringer endnu.</li>';

            return;

        }

        list.innerHTML =
            sorted.map((item) => {

                const badgeClass =
                    item.type === 'ude'
                        ? 'badge-ude'
                        : 'badge-inde';

                const badgeText =
                    item.type === 'ude'
                        ? 'Ude'
                        : 'Inde';

                return `
                    <li class="history-item">

                        <div class="history-left">

                            <span class="badge ${badgeClass}">
                                ${badgeText}
                            </span>

                            <span>
                                ${formatDateDK(item.dato)}
                            </span>

                        </div>

                        <button
                            class="btn-delete"
                            onclick="sletDag('${item.dato}')">
                            ✕
                        </button>

                    </li>
                `;

            }).join('');

    }


    function updateView() {

        ensureDatesInPeriod();

        renderStats();

        renderDayGrid();

        renderHistory();

        saveData();

    }


    function tilfoejDag() {

        const dato =
            document.getElementById('date-input').value;

        const type =
            document.getElementById('type-input').value;

        if (!dato) {

            alert('Vælg venligst en dato.');

            return;

        }

        const existing =
            data.find(
                item => item.dato === dato
            );

        if (existing) {

            existing.type = type;

        } else {

            data.push({
                dato,
                type
            });

        }

        saveData();

        updateView();

    }


    /*
     * NY FUNKTION
     *
     * Kan registrere dagens nat direkte fra URL'en.
     *
     * Eksempel:
     * ?type=ude
     *
     * eller:
     * ?type=inde
     */
    function registrerFraUrl() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        let type =
            params.get('type');

        /*
         * Accepter også et forkert/alternativt format
         * hvis URL'en ender med =ude eller =inde.
         */
        if (!type) {

            const pathMatch =
                window.location.pathname.match(
                    /=(ude|inde)\/?$/i
                );

            if (pathMatch) {

                type =
                    pathMatch[1].toLowerCase();

            }

        }

        /*
         * Hvis URL'en ikke indeholder
         * type=ude eller type=inde,
         * gør vi ingenting.
         */
        if (
            type !== 'ude' &&
            type !== 'inde'
        ) {

            return;

        }

        /*
         * Find dagens dato i dansk/lokal tid.
         *
         * Vi bruger IKKE toISOString()
         * her, fordi UTC kan give forkert dato
         * omkring midnat.
         */
        const nu = new Date();

        const dato = [

            nu.getFullYear(),

            String(
                nu.getMonth() + 1
            ).padStart(2, '0'),

            String(
                nu.getDate()
            ).padStart(2, '0')

        ].join('-');


        /*
         * Find dagens eksisterende registrering.
         */
        const existing =
            data.find(
                item => item.dato === dato
            );


        /*
         * Hvis dagen allerede findes,
         * ændrer vi bare typen.
         */
        if (existing) {

            existing.type = type;

        } else {

            /*
             * Ellers opretter vi dagen.
             */
            data.push({
                dato,
                type
            });

        }


        /*
         * Gem registreringen.
         */
        saveData();

        /*
         * Opdater hele siden.
         */
        updateView();


        /*
         * Fjern ?type=ude / ?type=inde
         * fra adressen uden at genindlæse siden.
         *
         * Det betyder, at hvis siden senere
         * genindlæses normalt, registrerer den
         * ikke dagen igen fra URL'en.
         */
        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );

    }


    function toggleDateType(iso) {

        const item =
            data.find(
                d => d.dato === iso
            );

        if (!item) {

            data.push({
                dato: iso,
                type: 'inde'
            });

        } else {

            item.type =
                item.type === 'ude'
                    ? 'inde'
                    : 'ude';

        }

        saveData();

        updateView();

    }


    function sletDag(dato) {

        if (
            !confirm(
                'Slet denne registrering?'
            )
        ) {
            return;
        }

        data =
            data.filter(
                item => item.dato !== dato
            );

        saveData();

        updateView();

    }


    function gemIndstillinger() {

        config.startDato =
            document.getElementById(
                'config-from'
            ).value ||
            DEFAULT_CONFIG.startDato;

        config.slutDato =
            document.getElementById(
                'config-to'
            ).value ||
            DEFAULT_CONFIG.slutDato;

        config.targetUde =
            Number(
                document.getElementById(
                    'config-target-ude'
                ).value
            ) ||
            DEFAULT_CONFIG.targetUde;

        config.targetInde =
            Number(
                document.getElementById(
                    'config-target-inde'
                ).value
            ) ||
            DEFAULT_CONFIG.targetInde;

        saveConfig();

        updateView();

    }


    function sætAlleTilUde() {

        const range =
            getRangeDates(
                config.startDato,
                config.slutDato
            );

        for (const iso of range) {

            const item =
                data.find(
                    d => d.dato === iso
                );

            if (item) {

                item.type = 'ude';

            } else {

                data.push({
                    dato: iso,
                    type: 'ude'
                });

            }

        }

        saveData();

        updateView();

    }


    function resetTilStandard() {

        config = {
            ...DEFAULT_CONFIG
        };

        saveConfig();

        updateConfigInputs();

        updateView();

    }


    function eksporterData() {

        const payload =
            JSON.stringify(
                {
                    config,
                    data
                },
                null,
                2
            );

        const blob =
            new Blob(
                [payload],
                {
                    type: 'application/json'
                }
            );

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement('a');

        a.href = url;

        a.download =
            'snorky-backup.json';

        a.click();

        URL.revokeObjectURL(url);

    }


    function importerData() {

        document
            .getElementById('import-file')
            .click();

    }


    document
        .getElementById('import-file')
        .addEventListener(
            'change',
            function (event) {

                const file =
                    event.target.files[0];

                if (!file) return;

                const reader =
                    new FileReader();

                reader.onload =
                    function (e) {

                        try {

                            const imported =
                                JSON.parse(
                                    e.target.result
                                );

                            if (
                                imported &&
                                imported.data
                            ) {

                                config = {
                                    ...DEFAULT_CONFIG,
                                    ...(imported.config || {})
                                };

                                data =
                                    Array.isArray(
                                        imported.data
                                    )
                                        ? imported.data
                                        : [];

                                saveConfig();

                                saveData();

                                updateConfigInputs();

                                updateView();

                                alert(
                                    '✅ Backup importeret.'
                                );

                            } else {

                                alert(
                                    '❌ Ugyldig backup-fil.'
                                );

                            }

                        } catch (err) {

                            alert(
                                '❌ Fejl ved import: ' +
                                err.message
                            );

                        }

                        event.target.value = '';

                    };

                reader.readAsText(file);

            }
        );


    function nulstilAlt() {

        if (
            !confirm(
                'Slet ALLE data?'
            )
        ) {
            return;
        }

        if (
            !confirm(
                'Sidste chance - kan ikke fortrydes!'
            )
        ) {
            return;
        }

        data = [];

        saveData();

        updateView();

    }


    /*
     * Normal opstart.
     */
    document
        .getElementById('date-input')
        .valueAsDate = new Date();

    updateConfigInputs();

    updateView();


    /*
     * Tjek til sidst om siden blev åbnet
     * med ?type=ude eller ?type=inde.
     */
    registrerFraUrl();

</script>

</body>
</html>
